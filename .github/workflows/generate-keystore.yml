name: Generate Signing Keystore (delete after use)

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: 'Password to use for the keystore and key'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias questcraft \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            -keypass "${{ github.event.inputs.keystore_password }}" \
            -dname "CN=QuestCraft, OU=Dev, O=Riley, L=Dagenham, ST=England, C=GB"

      - name: Print base64 keystore
        run: base64 -w0 release.keystore
